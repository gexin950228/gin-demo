basePath: /
host: localhost:8080
info:
  contact:
    name: API Support
    url: http://localhost:8080/home
  description: Go Gin 框架示例项目 API 文档，包含用户认证、文章管理、标签管理等接口
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Gin Demo API
  version: "1.0"
paths:
  /api-docs:
    get:
      description: 返回完整的 API 文档 JSON，包含所有接口的路径、方法、参数、响应等信息。可用于程序化获取接口列表。
      produces:
      - application/json
      responses:
        "200":
          description: 完整API文档
          schema:
            additionalProperties: true
            type: object
      summary: 获取所有接口文档
      tags:
      - 系统
  /articles/create:
    get:
      description: 返回新增文章表单页面，包含标题、内容输入和标签选择功能
      responses:
        "200":
          description: 新增文章HTML
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 新增文章页面
      tags:
      - 文章管理
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 创建新文章，支持同时设置标签（逗号分隔或数组形式传入）
      parameters:
      - description: 文章标题
        in: formData
        name: title
        required: true
        type: string
      - description: 文章内容
        in: formData
        name: content
        required: true
        type: string
      - collectionFormat: csv
        description: 标签名称列表（可选）
        in: formData
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "302":
          description: 重定向到文章列表
          schema:
            type: string
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建文章
      tags:
      - 文章管理
  /articles/edit:
    get:
      description: 返回指定文章的编辑页面，预填充标题、内容和当前标签
      parameters:
      - description: 文章ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 编辑文章HTML
          schema:
            type: string
        "400":
          description: 无效的文章ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 文章不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 编辑文章页面
      tags:
      - 文章管理
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 更新指定文章的标题、内容和标签。支持全量替换标签。
      parameters:
      - description: 文章ID
        in: formData
        name: id
        required: true
        type: integer
      - description: 文章标题
        in: formData
        name: title
        required: true
        type: string
      - description: 文章内容
        in: formData
        name: content
        required: true
        type: string
      - collectionFormat: csv
        description: 标签名称列表（全量替换）
        in: formData
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "302":
          description: 重定向到文章详情页
          schema:
            type: string
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 文章不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新文章
      tags:
      - 文章管理
  /articles/list:
    get:
      description: 返回文章列表页面，支持按标签筛选。返回所有文章及其关联的作者和标签信息。
      parameters:
      - description: 按标签名称筛选
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文章列表HTML
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 文章列表
      tags:
      - 文章管理
  /articles/view:
    get:
      description: 返回指定文章的完整详情，包括标题、内容、作者和标签信息
      parameters:
      - description: 文章ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 文章详情HTML
          schema:
            type: string
        "400":
          description: 无效的文章ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 文章不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 文章详情
      tags:
      - 文章管理
  /healthcheck:
    get:
      description: 检查服务、数据库和Redis的连接状态，用于容器化部署时探测服务是否就绪
      produces:
      - application/json
      responses:
        "200":
          description: 健康
          schema:
            additionalProperties: true
            type: object
        "503":
          description: 部分服务不可用
          schema:
            additionalProperties: true
            type: object
      summary: 服务健康检查
      tags:
      - 系统
  /home:
    get:
      description: 返回系统首页，展示用户信息和快捷入口
      responses:
        "200":
          description: 首页HTML
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 首页
      tags:
      - 文章管理
  /metrics:
    get:
      description: 返回 Prometheus 格式的监控指标数据，供 Prometheus Server 定期拉取
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus 指标数据
          schema:
            type: string
      summary: Prometheus 指标采集
      tags:
      - 系统
  /tags/all:
    get:
      description: 返回系统中所有已创建的标签列表，按名称升序排列
      produces:
      - application/json
      responses:
        "200":
          description: 标签列表
          schema:
            additionalProperties: true
            type: object
      summary: 获取所有标签
      tags:
      - 标签管理
  /tags/article-tags:
    get:
      description: 返回指定文章关联的所有标签
      parameters:
      - description: 文章ID
        in: query
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 标签列表
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 无效的文章ID
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 文章不存在
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 获取文章标签
      tags:
      - 标签管理
  /tags/create:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 创建新标签。如果同名标签已存在，直接返回已有标签而不重复创建。
      parameters:
      - description: 标签名称
        in: formData
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功或返回已有标签
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建标签
      tags:
      - 标签管理
  /tags/update-article-tags:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 全量替换指定文章的标签。传入的新标签列表会完全替换旧标签。不存在的标签会自动创建。
      parameters:
      - description: 文章ID
        in: formData
        name: id
        required: true
        type: integer
      - collectionFormat: csv
        description: 新的标签名称列表
        in: formData
        items:
          type: string
        name: tags
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 文章不存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新文章标签
      tags:
      - 标签管理
  /user/check-email:
    get:
      description: 检查指定邮箱是否已被其他用户注册，用于注册时实时校验
      parameters:
      - description: 邮箱地址
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 检查结果
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 检查邮箱是否存在
      tags:
      - 用户认证
  /user/check-username:
    get:
      description: 检查指定用户名是否已被其他用户使用，用于注册时实时校验
      parameters:
      - description: 用户名
        in: query
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 检查结果
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 检查用户名是否存在
      tags:
      - 用户认证
  /user/login:
    get:
      description: 返回用户登录表单页面，支持用户名和邮箱两种登录方式
      responses:
        "200":
          description: 登录页面HTML
          schema:
            type: string
      summary: 登录页面
      tags:
      - 用户认证
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 通过用户名或邮箱进行登录，支持切换登录方式。登录成功后返回Token并设置Cookie。
      parameters:
      - description: 账号（用户名或邮箱）
        in: formData
        name: account
        required: true
        type: string
      - description: 登录类型：email 或 username（默认自动判断）
        in: formData
        name: login_type
        type: string
      - description: 密码
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: 重定向到首页
          schema:
            type: string
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 账号或密码错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 用户登录
      tags:
      - 用户认证
  /user/logout:
    get:
      description: 清除当前用户的登录Token并重定向到登录页
      responses:
        "302":
          description: 重定向到登录页
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 用户登出
      tags:
      - 用户认证
  /user/register:
    get:
      description: 返回用户注册表单页面
      responses:
        "200":
          description: 注册页面HTML
          schema:
            type: string
      summary: 注册页面
      tags:
      - 用户认证
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 创建新用户账号，需要提供用户名、邮箱、密码（含确认密码）和邮箱验证码
      parameters:
      - description: 用户名（3-20位字母数字下划线）
        in: formData
        name: username
        required: true
        type: string
      - description: 邮箱地址
        in: formData
        name: email
        required: true
        type: string
      - description: 密码（至少8位，包含2种以上字符类型）
        in: formData
        name: password
        required: true
        type: string
      - description: 确认密码
        in: formData
        name: confirm_password
        required: true
        type: string
      - description: 邮箱验证码（6位数字）
        in: formData
        name: verify_code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: 重定向到登录页
          schema:
            type: string
        "400":
          description: 参数错误或格式不合法
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 用户名或邮箱已存在
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 用户注册
      tags:
      - 用户认证
  /user/send-code:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 向指定邮箱发送6位数字验证码，用于注册验证。验证码5分钟内有效。
      parameters:
      - description: 邮箱地址
        in: formData
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 发送成功
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 参数错误
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: 发送失败
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 发送邮箱验证码
      tags:
      - 用户认证
securityDefinitions:
  BearerAuth:
    description: '请在请求头中携带 Token: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
