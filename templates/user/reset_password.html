<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-container {
            background: white;
            padding: 3rem;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 420px;
            max-width: 90%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            color: #555;
            font-size: 0.88rem;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .code-group { display: flex; gap: 0.6rem; }
        .code-group input { flex: 1; }
        .send-code-btn {
            padding: 0.75rem 1rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            white-space: nowrap;
            transition: background-color 0.3s;
        }
        .send-code-btn:hover:not(:disabled) { background: #5568d3; }
        .send-code-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .submit-btn {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .submit-btn:hover:not(:disabled) { opacity: 0.9; }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert-error {
            background: #fee;
            color: #c33;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.88rem;
            display: none;
            border: 1px solid #fcc;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            padding: 0.7rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            font-size: 0.88rem;
            display: none;
            border: 1px solid #c3e6cb;
        }
        .link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.88rem;
            color: #888;
        }
        .link a { color: #667eea; text-decoration: none; }
        .link a:hover { text-decoration: underline; }
        .back-link {
            text-align: center;
            margin-top: 1rem;
        }
        .back-link a {
            color: #888;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .back-link a:hover { color: #667eea; }
    </style>
</head>
<body>
    <div class="reset-container">
        <h1>重置密码</h1>
        <p class="subtitle">输入注册邮箱，我们将发送验证码到您的邮箱</p>

        <div class="alert-error" id="errorMsg"></div>
        <div class="alert-success" id="successMsg"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">邮箱地址</label>
                <input type="email" id="email" name="email" placeholder="请输入注册时的邮箱" required>
            </div>

            <div class="form-group">
                <label for="verify_code">邮箱验证码</label>
                <div class="code-group">
                    <input type="text" id="verify_code" name="verify_code" placeholder="请输入验证码" maxlength="6">
                    <button type="button" class="send-code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
                </div>
            </div>

            <div class="form-group">
                <label for="new_password">新密码</label>
                <input type="password" id="new_password" name="new_password" placeholder="请输入新密码（至少6位）" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">重置密码</button>
        </form>

        <div class="back-link">
            <a href="{{.url_login}}">&#8592; 返回登录</a>
        </div>
    </div>

    <script src="/static/js/jquery.js"></script>
    <script>
        function showError(msg) {
            $('#errorMsg').html('&#9888; ' + msg).show();
            $('#successMsg').hide();
        }
        function showSuccess(msg) {
            $('#successMsg').html('&#10004; ' + msg).show();
            $('#errorMsg').hide();
        }

        // 发送验证码
        var codeCountdown = 0;
        function sendCode() {
            var email = $('#email').val().trim();
            if (!email) {
                showError('请先输入邮箱地址');
                return;
            }
            var $btn = $('#sendCodeBtn');
            $btn.prop('disabled', true).text('发送中...');

            $.ajax({
                url: '{{.url_send_reset_code}}',
                type: 'POST',
                data: { email: email },
                success: function(resp) {
                    showSuccess(resp.message || '验证码已发送，请查收邮件');
                    // 60秒倒计时
                    codeCountdown = 60;
                    $btn.text(codeCountdown + '秒后重试');
                    var timer = setInterval(function() {
                        codeCountdown--;
                        if (codeCountdown <= 0) {
                            clearInterval(timer);
                            $btn.prop('disabled', false).text('获取验证码');
                        } else {
                            $btn.text(codeCountdown + '秒后重试');
                        }
                    }, 1000);
                },
                error: function(xhr) {
                    $btn.prop('disabled', false).text('获取验证码');
                    var msg = '验证码发送失败';
                    if (xhr.status === 404) {
                        msg = '该邮箱尚未注册';
                    } else if (xhr.status === 400) {
                        msg = '请输入有效的邮箱地址';
                    } else if (xhr.status === 500) {
                        msg = '验证码发送失败，请稍后重试';
                    }
                    try { msg = JSON.parse(xhr.responseText).error || msg; } catch(e) {}
                    showError(msg);
                }
            });
        }

        // 提交重置密码
        $('#resetForm').on('submit', function(e) {
            e.preventDefault();
            var email = $('#email').val().trim();
            var code = $('#verify_code').val().trim();
            var pwd = $('#new_password').val();

            if (!email || !code || !pwd) {
                showError('请填写完整信息');
                return;
            }
            if (pwd.length < 6) {
                showError('新密码长度至少6位');
                return;
            }

            var $btn = $('#submitBtn');
            $btn.prop('disabled', true).text('重置中...');

            $.ajax({
                url: '{{.url_reset_password}}',
                type: 'POST',
                data: {
                    email: email,
                    verify_code: code,
                    new_password: pwd
                },
                success: function(resp) {
                    showSuccess(resp.message || '密码重置成功');
                    $btn.text('重置成功');
                    // 3秒后跳转登录页
                    setTimeout(function() {
                        window.location.href = resp.redirect || '{{.url_login}}';
                    }, 1500);
                },
                error: function(xhr) {
                    $btn.prop('disabled', false).text('重置密码');
                    var msg = '重置失败，请重试';
                    if (xhr.status === 401) {
                        msg = '验证码错误或已过期';
                    } else if (xhr.status === 404) {
                        msg = '该邮箱尚未注册';
                    } else if (xhr.status === 400) {
                        msg = '请检查输入信息';
                    }
                    try { msg = JSON.parse(xhr.responseText).error || msg; } catch(e) {}
                    showError(msg);
                }
            });
        });
    </script>
</body>
</html>
