# ===========================================
# 引导配置（bootstrap）
# 仅用于连接 Nacos 配置中心，业务配置（mysql/redis/email 等）全部从 Nacos 拉取
# Nacos 连接信息不能放 Nacos 自身，否则会循环依赖
# ===========================================
nacos:
  server_host: "172.29.147.221"      # Nacos 服务端地址
  server_port: 8848                   # Nacos 服务端端口
  username: "nacos"                   # Nacos 认证用户名
  password: 'Gexin..950228'           # Nacos 认证密码
  namespace_id: "gin-demo-id"         # 命名空间 ID（与配置中心存储的命名空间一致）
  group: "DEFAULT_GROUP"              # 配置分组
  data_id_prefix: "app"               # 配置 dataId 前缀，最终 dataId = <prefix>-<env>.yaml
